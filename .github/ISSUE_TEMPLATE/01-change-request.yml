name: "CR · 팀 간 변경 요청"
description: "여러 저장소에 영향을 주는 API·데이터·동작 변경을 합의하고 검증합니다."
title: "[CR] "
labels: ["change-request"]
projects: ["try-angle-at/2"]
body:
  - type: markdown
    attributes:
      value: |
        변경을 주로 책임지는 저장소에 작성하세요. 관련 팀과 합의한 뒤 필요한 구현 이슈를 하위 이슈로 연결합니다.
        상태·담당자·확정 우선순위는 조직 Project에서 관리하고, 이슈 본문에는 합의 내용과 검증 근거를 남깁니다.
        여러 레포의 CR은 `owner/repo#번호`로 구분합니다. 기존 CR 번호가 있다면 제목에 유지해도 됩니다.
  - type: input
    id: requester
    attributes:
      label: "요청자 · 날짜"
      placeholder: "요청 팀 또는 담당자 · YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: "변경 대상"
      description: "대상 API, 데이터 구조, 기능 또는 화면을 적어 주세요."
      placeholder: "POST /api/... 또는 변경할 기능"
    validations:
      required: true
  - type: dropdown
    id: requested-priority
    attributes:
      label: "요청 우선순위"
      description: "접수 후 담당자와 확정한 우선순위는 Project의 Priority에 기록합니다."
      options:
        - "P0 · 장애·데이터 유실·핵심 기능 차단"
        - "P1 · 주요 기능·품질 개선"
        - "P2 · 일반 개선·정리"
      default: 1
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: "의존 · 관련"
      description: "관련 이슈, 스펙, 레포, 선행 작업을 링크로 적어 주세요. 없으면 해당 없음으로 적습니다."
      placeholder: "선행 작업: owner/repo#123 / 관련 스펙: URL"
  - type: textarea
    id: background
    attributes:
      label: "1. 증상 · 배경"
      description: "무엇이 안 되는지, 실측 결과와 근거를 적어 주세요. 로그·샘플은 민감 정보를 제거하고 첨부합니다."
      placeholder: "현재 문제 / 재현 조건 / 수치·날짜 / 근거 파일 또는 링크"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "2. 변경 요청 — 현재 → 제안"
      description: "API 변경은 필드·타입·필수 여부·검증·저장을, 다른 변경은 현재 동작과 원하는 동작을 적어 주세요."
      value: |
        | 필드 또는 동작 | 현재 | 제안 | 타입 | 필수 | 검증 규칙 | 저장 |
        |---|---|---|---|---|---|---|
        | | | | | | | |

        ### 예시 요청
        ```json
        {}
        ```

        ### 예시 응답 (변경이 있으면)
        ```json
        {}
        ```
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: "3. 저장 · 마이그레이션"
      description: "컬럼·테이블 변경, 기존 데이터 처리, NULL·백필·인덱스. 해당 없으면 이유를 적어 주세요."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "4. 영향 · 호환성 · 반영 순서"
      description: "배포 순서는 변경별로 합의합니다. 각 항목에 담당자, 구현 이슈, 배포·빌드 근거 또는 해당 없음을 기록하세요."
      value: |
        - 서버/API:
        - SDK/앱 (적용 빌드·플래그):
        - 어드민/소비 화면:
        - 기타 관련 레포:
        - 기존 데이터/구버전 클라이언트:
        - 서버 반영 전 클라이언트 동작:
        - 합의한 반영 순서와 선행 조건:

        ### 반영 확인
        - [ ] 서버/API 반영 확인 또는 해당 없음 근거
        - [ ] SDK/앱 반영 확인 또는 해당 없음 근거
        - [ ] 어드민/소비 화면 반영 확인 또는 해당 없음 근거
        - [ ] 기타 관련 작업 반영 확인 또는 해당 없음 근거
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "5. 수용 기준 · 검증 절차"
      description: "요청자가 완료 여부를 판단할 수 있는 절차와 기대 결과를 적어 주세요."
      value: |
        1. 입력/재현 절차 → 기대 응답·저장값:
        2. 조회/소비 화면 → 기대 결과:
        3. 실제 사용 환경에서 처음부터 끝까지 확인할 절차:
        4. 구버전·기존 데이터 호환성 확인:

        ### 검증 결과 (진행하면서 작성)
        - 검증자·날짜:
        - 환경·배포 버전·빌드:
        - 결과·근거 링크:
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: "6. 롤백"
      description: "되돌릴 조건·순서·관련 팀 조치와 데이터 복구 한계를 적어 주세요. 해당 없으면 이유를 적습니다."
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: "합의 · 이력"
      description: "요청 등록만으로 합의가 완료되지는 않습니다. 관련 담당자의 합의 댓글과 변경 결정을 연결하세요."
      value: |
        - YYYY-MM-DD: 제안 작성.
        - 합의한 담당자·댓글:
        - 후속 변경 결정:
