name: "Task · 기능·개선 작업"
description: "한 저장소의 기능, 개선 또는 CR 구현 작업을 요청합니다."
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "실제 작업을 책임지는 저장소에 작성하세요. 관련 CR이 있으면 상위 이슈로 연결하고, 담당자·상태·우선순위는 조직 Project에서 관리합니다."
  - type: textarea
    id: goal
    attributes:
      label: "배경 · 원하는 결과"
      description: "왜 필요한지와 완료 후 달라지는 동작을 적어 주세요."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "작업 범위"
      placeholder: "변경할 기능·화면·문서와 필요한 세부 작업"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건 · 확인 방법"
      description: "병합, 배포, 결과 확인 중 어디까지가 이 작업의 완료인지 명시하세요."
      value: |
        - [ ] 기대 동작:
        - [ ] 확인 방법·결과:
        - [ ] 필요한 배포·문서 반영 또는 해당 없음:
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: "상위 CR · 의존 작업 · 참고"
      placeholder: "owner/repo#123, 스펙 링크, 기다리는 작업 또는 해당 없음"
