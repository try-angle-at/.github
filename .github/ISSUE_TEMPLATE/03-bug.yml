name: "Bug · 오류 제보"
description: "재현 조건과 기대 결과를 바탕으로 오류를 추적합니다."
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "현재 동작 · 기대 동작"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "재현 절차"
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "환경 · 근거"
      description: "앱/서버 버전, 기기·OS, 발생 시점, 로그 또는 화면. 민감 정보는 제거해 주세요."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "영향 · 우회 방법"
      placeholder: "영향받는 사용자·기능, 빈도, 데이터 유실 여부, 임시 대응"
  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건 · 관련 이슈"
      placeholder: "어떤 재현·회귀 확인을 통과해야 하는지와 관련 CR/이슈 링크"
